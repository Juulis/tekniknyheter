<!DOCTYPE html>
<html lang="sv" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tekniknyheter — Tesla, NVIDIA, AI och mer</title>
    <meta
      name="description"
      content="Positiva tekniknyheter med fokus på Tesla, elbilar, Elon Musk, NVIDIA, AI och geopolitik."
    />
    <meta name="theme-color" content="#070b16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fc" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://juulis.github.io/tekniknyheter/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:title" content="Tekniknyheter" />
    <meta
      property="og:description"
      content="Positiva tekniknyheter: Tesla, NVIDIA, AI, Elon Musks bolag och geopolitik."
    />
    <meta property="og:url" content="https://juulis.github.io/tekniknyheter/" />
    <meta property="og:site_name" content="Tekniknyheter" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tekniknyheter" />
    <meta
      name="twitter:description"
      content="Positiva tekniknyheter: Tesla, NVIDIA, AI, Elon Musks bolag och geopolitik."
    />

    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tn-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#news-list">Hoppa till nyheter</a>
    <div class="wrap">
      <header>
        <div class="brand">
          <p class="eyebrow">Positiv teknik · bot-driven</p>
          <h1>Tekniknyheter</h1>
          <p class="lede">Fokus: Tesla, elbilar, Elon Musk, NVIDIA, AI, SpaceX/xAI/Neuralink och geopolitik.</p>
        </div>
        <div class="header-actions">
          <div id="status" class="badge" data-state="loading" role="status" aria-live="polite">Startar…</div>
          <button id="theme-toggle" type="button" class="ghost" aria-label="Byt mellan ljust och mörkt tema">Tema</button>
        </div>
      </header>

      <section class="filters" aria-label="Sök och filtrera">
        <label class="search" for="search">
          <span class="sr-only">Sök nyheter</span>
          <input
            id="search"
            type="search"
            placeholder="Sök Tesla, NVIDIA, AI…"
            autocomplete="off"
            enterkeyhint="search"
          />
        </label>
        <div id="category-filters" class="category-filters" role="group" aria-label="Kategorier"></div>
        <div class="toolbar">
          <label class="sort" for="sort">
            <span class="sr-only">Sortering</span>
            <select id="sort" aria-label="Sortering">
              <option value="priority">Redaktionell prio</option>
              <option value="newest">Nyast först</option>
              <option value="oldest">Äldst först</option>
              <option value="title">Titel A–Ö</option>
            </select>
          </label>
          <button id="refresh" type="button">Uppdatera</button>
          <button id="clear-filters" type="button" class="ghost" hidden>Rensa filter</button>
          <span id="count" class="count" hidden aria-live="polite"></span>
        </div>
      </section>

      <main id="news-list" class="grid" tabindex="-1" aria-live="polite" aria-busy="true"></main>

      <footer>
        <span>Frontend: GitHub Pages</span>
        <span aria-hidden="true">·</span>
        <span>Backend: Vercel</span>
        <span aria-hidden="true">·</span>
        <span>Ingest: <code>POST /api/ingest</code></span>
      </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
