<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tekniknyheter</title>
    <meta name="description" content="Tekniknyheter samlade från bots och källor." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <h1>Tekniknyheter</h1>
          <p>Skal för en nyhetssida. Innehåll matas in via API.</p>
        </div>
        <div id="status" class="badge" data-state="loading">Startar…</div>
      </header>

      <div class="toolbar">
        <button id="refresh" type="button">Uppdatera</button>
      </div>

      <main id="news-list" class="grid" aria-live="polite"></main>

      <footer>
        Frontend: GitHub Pages · Backend: Vercel · Nyheter via <code>POST /api/ingest</code>
      </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
