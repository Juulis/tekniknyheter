<!DOCTYPE html>
<html lang="sv" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tekniknyheter</title>
    <meta name="description" content="Tekniknyheter samlade från bots och källor." />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tn-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <p class="eyebrow">Daglig teknik · bot-driven</p>
          <h1>Tekniknyheter</h1>
          <p class="lede">Samlar AI, hårdvara, mjukvara och policy — redo för live-feed från din nyhetsbot.</p>
        </div>
        <div class="header-actions">
          <div id="status" class="badge" data-state="loading">Startar…</div>
          <button id="theme-toggle" type="button" class="ghost" aria-label="Byt tema">Tema</button>
        </div>
      </header>

      <section class="filters" aria-label="Sök och filtrera">
        <label class="search">
          <span class="sr-only">Sök nyheter</span>
          <input
            id="search"
            type="search"
            placeholder="Sök titel, sammanfattning eller källa…"
            autocomplete="off"
          />
        </label>
        <div id="category-filters" class="category-filters" role="group" aria-label="Kategorier"></div>
        <div class="toolbar">
          <label class="sort">
            <span class="sr-only">Sortering</span>
            <select id="sort" aria-label="Sortering">
              <option value="newest">Nyast först</option>
              <option value="oldest">Äldst först</option>
              <option value="title">Titel A–Ö</option>
            </select>
          </label>
          <button id="refresh" type="button">Uppdatera</button>
          <button id="clear-filters" type="button" class="ghost" hidden>Rensa filter</button>
          <span id="count" class="count" hidden></span>
        </div>
      </section>

      <main id="news-list" class="grid" aria-live="polite"></main>

      <footer>
        <span>Frontend: GitHub Pages</span>
        <span aria-hidden="true">·</span>
        <span>Backend: Vercel</span>
        <span aria-hidden="true">·</span>
        <span>Ingest: <code>POST /api/ingest</code></span>
      </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
